name: Release

# Obsidian's community plugin registry expects the release tag to equal the
# manifest version exactly (e.g. 1.0.0, no "v" prefix), and reads main.js,
# manifest.json and styles.css as individual release assets. Only those three
# files are attached to the release; the verified zip is kept as a workflow
# artifact, because Obsidian ignores any other release file.
on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  # Build provenance attestations for the release assets.
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Package
        run: npm run package

      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "$MANIFEST_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Stage release assets
        run: |
          mkdir -p release
          cp dist/main.js manifest.json release/
          if [ -f styles.css ]; then cp styles.css release/; fi

      # Runs before the release is created, so a release is never published
      # without attestations for its assets.
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: 'release/*'

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-release
          path: |
            release/*
            build/*.zip
